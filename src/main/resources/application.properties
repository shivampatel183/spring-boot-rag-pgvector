spring.application.name=BotAI

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/spring_ai
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=NONE

# Gemini Chat
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview

# Gemini Embedding
spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

server.port=8081
